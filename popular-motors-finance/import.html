function importData() {
    const existing = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    const existingVehicles = new Set(existing.map(r => r.vehicleNumber));

    const now = Date.now();
    let count = 0;

    rawCustomers.forEach((row, index) => {
        const [
            name, vehicle, phone, startDate, emi, tenure, outstanding,
            borrowerAddress,
            guarantorName, guarantorPhone, guarantorAddress
        ] = row;

        if (existingVehicles.has(vehicle)) return;

        const rate = 0.015;
        const totalPayable = emi * tenure;
        const loanAmount = Math.round(totalPayable / (1 + rate * tenure));
        const historicalPaid = Math.max(0, totalPayable - outstanding);

        const record = {
            id: now + index,
            timestamp: now + index,
            customerName: name,
            mobileNumber: phone,
            vehicleNumber: vehicle,
            borrowerAddress: borrowerAddress || '',
            guarantorName: guarantorName || '',
            guarantorPhone: guarantorPhone || '',
            guarantorAddress: guarantorAddress || '',
            startDate,
            loanAmount,
            tenureMonths: tenure,
            rate,
            emi,
            totalPayable,
            payments: [],
            lateFees: []
        };

        if (historicalPaid > 0) {
            record.payments.push({
                id: now + index + 10000,
                amount: historicalPaid,
                date: startDate,
                type: 'Historical Balance'
            });
        }

        existing.push(record);
        count++;
    });

    localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));

    document.getElementById('status').textContent = `✅ ${count} customers imported! Redirecting...`;
    document.getElementById('status').style.display = 'block';
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
}
